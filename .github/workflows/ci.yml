name: Source checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: source-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=2048
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint:js --fix
      - if: ${{ !cancelled() }}
        run: git diff > /tmp/format.patch
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: formatting
          path: /tmp/format.patch
          retention-days: 1
      - if: ${{ !cancelled() }}
        run: pnpm typecheck
      - if: ${{ !cancelled() }}
        run: pnpm check
      - if: ${{ !cancelled() }}
        run: pnpm test:unit --maxWorkers=1 --minWorkers=1
      - if: ${{ !cancelled() }}
        run: pnpm build
